<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>trvel-html</title>
</head>
<body>
    <h1>Book your vacation</h1>
    <div>
        <label for="name">Name</label>
        <input type="text" id="name" Placeholder="Enter your name">
    </div>
    <div>
        <label for="Phone">Phone No.</label>
        <input type="text" id="Phone" placeholder="Enter your phone no.">
    </div>
    <div>
        <label for="address">Address</label>
        <input type="text" id="address" placeholder="Enter your Address">
    </div>
    <div>
    <label for="gender">Gender</label>
        <select  id="gender" required>
            <option value="" disabled selected>Select Gender</option>
            <option value="Male">Male</option>
            <option value="Female">Female</option>
            <option value="transgender">transgender</option>
        </select>
      </div>
      <div>
        <h2>Select the place you want to visit</h2>

        <input type="radio" id="Bali" name="Places">
        <label for="Bali">Bali</label>

        <input type="radio" id="Thailand" name="Places">
        <label for="Thailand">Thailand</label>

        <input type="radio" id="Agra" name="Places">
        <label for="Agra">Agra</label>

        <input type="radio" id="Rajasthan" name="Places">
        <label for="Rajasthan">Rajasthan</label>
      </div>
    
</body>
</html>
