<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <form action="/submit.php">
      <div>
        <label for="name">Name</label>
        <input id="name" type="text" placeholder="Enter your name" />
      </div>
      <div>
        <label for="phone">Phone number</label>
        <input id="phone" type="tel" placeholder="Enter your Phone no." />
      </div>
      
      <div>
        <label for="email">Enter your email</label>
        <input id="email" type="email" placeholder="Enter your email Id" />
      </div>
      <div>
        <label for="DOB">Date of birth</label>
        <input id="DOB" type="date" placeholder="Enter your DOB" required/>
      </div>
      <div>
        <label for="passsword">Password</label>
        <input id="password" type="text" placeholder="Enter password">
      </div>
      <div>
        <label for="gender">Gender</label>
        <select  id="gender" required>
            <option value="" disabled selected>Select Gender</option>
            <option value="Male">Male</option>
            <option value="Female">Female</option>
            <option value="transgender">transgender</option>
        </select>
      </div>
      <div>
        <h3>Subscription Plan</h3>
        <input id="basic" type="radio" name="subscription">
        <label for="basic">Basic</label>

        <input type="radio" id="premium" name="subscription">
        <label for="premium">Premium</label>

        <input type="radio" id="vip" name="subscription">
        <label for="vip">VIP</label>
      </div>
      <div>
        <label for="checkbox">I agree all the terms and conditions.</label>
        <input type="checkbox" id="checkbox" name="checkbox">
      </div>
      <div>
        <label for="comment">Comment</label>
        <textarea name="comment" id="comment" rows="4" placehoder="Write your comment"></textarea>
      </div>
      <div>
        <button type="submit">Submit</button>
      </div>
    </form>
  </body>
</html>
