<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main>
      <section class="instagram">
        <select name="language" id="English">
          <option value="English">English</option>
          <option value="Hindi">Hindi</option>
          <option value="French">French</option>
        </select>
      </section>
      <section class="link">
        <div>
          <h1 id="insta">Instagram</h1>
        </div>
        <div>
          <button id="facebook">Continue With FaceBook</button>
        </div>
        <div>
          <p id="or">OR</p>
        </div>
        <div>
          <input id="box1"
            type="text"
            placeholder="phone number,username or email address"/>
        </div>

        <div>
          <input id="box2" type="text" placeholder="password"/>
        </div>
        <div>
          <a id="forget" href="forget">Forget Password?</a>
        </div>
        <div>
          <button id="log">Log in</button>
        </div>
        <div>
          <p id="signup">Don't have an account?<a id="up" href="Sign up">Sign up</a></p>
        </div>
      </section>
    </main>
  </body>
</html>
